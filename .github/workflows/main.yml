name: Deploy to VPS

on:
  push:
    branches:
      - main  # or whatever branch triggers the deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CD pipe

    env:
      REMOTE_DIR: /root/bms 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Build api contract
        run: |  
            pnpm install
            pnpm --filter=@repo/api-contract build

      - name: Install dependencies
        run: pnpm install
          

      - name: Build
        run: pnpm build

      - name: Create deployment archive
        run: |
          tar --exclude='node_modules' \
          --exclude='.git' \
          --exclude='.DS_Store' \
          --warning=no-file-changed \
          -czf deploy.tar.gz . || true

      - name: Verify archive exists
        run: test -f deploy.tar.gz

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Clean remote directory
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "rm -rf $REMOTE_DIR/* && mkdir -p $REMOTE_DIR"

      - name: Upload archive
        run: scp -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_DIR/

      - name: Write env files locally
        run: |
          cat > api.env << EOF
          NODE_ENV=production
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_PORT=${{ secrets.DATABASE_PORT }}
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME=${{ secrets.DATABASE_NAME }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          REFRESH_JWT_SECRET=${{ secrets.REFRESH_JWT_SECRET }}
          REFRESH_JWT_EXPIRES_IN=${{ secrets.REFRESH_JWT_EXPIRES_IN }}
          SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          DOMAIN=${{ secrets.DOMAIN }}
          SECURE=${{ secrets.SECURE }}
          SPACES_ENDPOINT=${{ secrets.SPACES_ENDPOINT }}
          SPACES_KEY=${{ secrets.SPACES_KEY }}
          SPACES_SECRET=${{ secrets.SPACES_SECRET }}
          SPACES_REGION=${{ secrets.SPACES_REGION }}
          SPACES_CDN_URL=${{ secrets.SPACES_CDN_URL }}
          RESEND=${{ secrets.RESEND }}
          EOF
          cat > web.env.local << EOF
          SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
          SECURE=${{ secrets.SECURE }}
          EOF

      - name: Extract archive on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd $REMOTE_DIR && tar -xzf deploy.tar.gz && rm deploy.tar.gz
          "

      - name: Upload env files to server
        run: |
          scp -o StrictHostKeyChecking=no api.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_DIR/apps/api/.env
          scp -o StrictHostKeyChecking=no web.env.local ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_DIR/apps/web/.env.local

      - name: Deploy remotely
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd $REMOTE_DIR && \
            pnpm install && \
            DATABASE_URL='${{ secrets.DATABASE_URL }}' pnpm db:migrate && \
            pm2 delete all || true && \
            pm2 start ecosystem.config.js
          "
