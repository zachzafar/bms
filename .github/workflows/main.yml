name: Deploy to VPS

on:
  push:
    branches:
      - main  # or whatever branch triggers the deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CD pipe

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Build api contract
        run: |  
            pnpm install
            pnpm --filter=@repo/api-contract build

      - name: Install dependencies
        run: pnpm install
          

      - name: Build
        run: pnpm build

      - name: Create deployment archive
        run: |
          tar --exclude='node_modules' \
          --exclude='.git' \
          --exclude='.DS_Store' \
          --warning=no-file-changed \
          -czf deploy.tar.gz . || true

      - name: Verify archive exists
        run: test -f deploy.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/root/bms"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v0.1.4
        env:
            PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: |
              ${{ env.PRIVATE_KEY }}
          script: |
            cd /root/bms
            rm -rf ./*
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            pnpm install
            pm2 delete all || true
            pm2 start ecosystem.config.js
