name: Deploy to VPS

on:
  push:
    branches:
      - main  # or whatever branch triggers the deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CD pipe

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Build api contract
        run: |  
            pnpm install
            pnpm --filter=@repo/api-contract build

      - name: Install dependencies
        run: pnpm install
          

      - name: Build
        run: pnpm build

      - name: Create deployment archive
        run: |
          tar --exclude='node_modules' \
          --exclude='.git' \
          --exclude='.DS_Store' \
          --warning=no-file-changed \
          -czf deploy.tar.gz . || true

      - name: Verify archive exists
        run: test -f deploy.tar.gz

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload archive to VPS
        run: |
          scp -o StrictHostKeyChecking=no -P 22 deploy.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/bms/

      - name: SSH into VPS and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /root/bms
            rm -rf ./*
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            pnpm install
            pm2 delete all || true
            pm2 start ecosystem.config.js
          EOF
